name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR / branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Legacy Rust implementation (behavioural reference until the TS port reaches parity).
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: legacy/rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # TypeScript workspace (pnpm-workspace.yaml): one install from the root lockfile, then lint and
  # every package's typecheck / test (against workspace sources, no build needed) and build.
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Version comes from "packageManager" in the root package.json (pnpm@9.x).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build

  # Light-weight worker tests: they run against the in-process fake worker, no GPU or model needed.
  workers-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/fake/requirements.txt
      - name: Install light dependencies
        # fake/requirements.txt already brings fastapi, httpx and pytest; numpy is used by the
        # text-splitting / backend tests. torch, qwen-tts, sherpa-onnx etc. are NOT installed.
        run: pip install -r fake/requirements.txt numpy
      - run: python -m pytest

  # Build the Core image to catch Dockerfile / dependency breakage. Nothing is pushed.
  docker-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.core
          push: false
          tags: miyoria-core:ci
          cache-from: type=gha,scope=core-image
          cache-to: type=gha,scope=core-image,mode=max

  # `docker compose config` validates the compose file (both with and without the core profile).
  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate deploy/docker-compose.yml
        working-directory: deploy
        env:
          POSTGRES_PASSWORD: ci-only
        run: |
          docker compose config --quiet
          touch ../.env
          docker compose --profile core config --quiet
