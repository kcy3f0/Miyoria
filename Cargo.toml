[workspace]
resolver = "3"
members = ["crates/*", "apps/miyoria"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# internal
miyoria-types = { path = "crates/miyoria-types" }
miyoria-kernel = { path = "crates/miyoria-kernel" }
miyoria-llm = { path = "crates/miyoria-llm" }
miyoria-llm-openai = { path = "crates/miyoria-llm-openai" }
miyoria-profile = { path = "crates/miyoria-profile" }
miyoria-agent = { path = "crates/miyoria-agent" }
miyoria-scheduler = { path = "crates/miyoria-scheduler" }
miyoria-commands = { path = "crates/miyoria-commands" }
miyoria-store = { path = "crates/miyoria-store" }
miyoria-discord = { path = "crates/miyoria-discord" }

# external
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = { version = "1", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 1
