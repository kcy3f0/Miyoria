[package]
name = "miyoria-mcp"
description = "MCP client (external tools into the registry) and optional read-only MCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "miyoria-mcp-fixture"
path = "tests/fixtures/fixture_server.rs"
test = false
doc = false

[dependencies]
miyoria-kernel.workspace = true
miyoria-llm.workspace = true
miyoria-store.workspace = true
miyoria-tools.workspace = true
miyoria-types.workspace = true
anyhow.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
axum = "0.8"
http = "1"
subtle = "2.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rmcp = { version = "3.8", default-features = false, features = [
    "client",
    "server",
    "transport-io",
    "transport-child-process",
    "which-command",
    "transport-streamable-http-client-reqwest",
    "reqwest-tls-no-provider",
    "transport-streamable-http-server",
] }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
