# Miyoria 設定檔。複製成 miyoria.toml,或執行 `npx miyoria init`;之後用 `miyoria config` 修改。
# 字串可以用 ${ENV_VAR} 或 ${ENV_VAR:-預設值} 引用環境變數 / .env。

[core]
profile = "deepseek-chan"          # profiles/<id>/
profiles_dir = "profiles"
database_url = "${DATABASE_URL:-sqlite:data/miyoria.db}"
log = "info,miyoria=debug"

# ---- LLM ----------------------------------------------------------------
# 任何 OpenAI 相容 API 都可以:填 base_url、api_key,模型 id 在 purposes 裡。
[llm.providers.deepseek]
kind = "deepseek"                  # deepseek | openai | openai-compatible
base_url = "${LLM_BASE_URL:-https://api.deepseek.com}"
api_key = "${LLM_API_KEY:-}"

# 全域預設;profile.toml 的 [llm.purposes] 會覆寫
[llm.purposes]
chat = ["deepseek:deepseek-chat"]
# 高風險動作的自我審核;不設就用 chat 的模型(啟動後第一次審核會記一行警告)
review = ["deepseek:deepseek-chat"]
# 她的內心獨白(心智迴圈);不設就用 chat 的模型(會記一行警告)
mind = ["deepseek:deepseek-chat"]

# 推理模型要不要先思考,依用途(沒列的 = 不思考)。不急的判斷開、要即時的關:
# 文字回覆會思考、語音回覆一律不思考(agent 每次自己決定,不看這裡的 chat)
[llm.thinking]
chat = true          # 文字聊天回覆
review = true        # 高風險動作的自我審核
mind = true          # 她的內心獨白(心智迴圈)
summarizer = true    # 記憶整理
fast = false         # 要不要插話的快速判斷(語音裡一律不思考)

# 推理等級(off | low | medium | high),依用途;取代上面的開關(這裡沒列的用途才看 [llm.thinking],
# 兩邊都沒列就用預設值)。支援 reasoning_effort 的 provider 直接送等級;只有開關的
# (deepseek / opencode)low / medium / high 都是「開」,再用 max_tokens 限制推理長度
# (provider 設定的 reasoning_effort = true / reasoning_max_tokens = { low = 2048, medium = 8192 })
[llm.reasoning]
chat_voice = "off"     # 語音回話,要即時
chat_text = "off"      # 一般文字回話
chat_intent = "low"    # 她自己發起、會用工具的回合
fast = "off"           # 灰色區判斷、翻譯
appraise = "low"
plan = "medium"
plan_daily = "high"    # 每天的日計畫
reflect = "high"
# review = "medium"    # 高風險動作的自我審核
# summarizer = "off"   # 對話整理、記憶整理(沒設的話照 [llm.thinking] summarizer)

# 看圖:聊天模型支援圖片時,她直接用它看圖(deepseek-v4.1-flash 可以)。
# 不收圖片的模型或 provider 標 false(沒列的 = 收);被 API 拒絕時也會自動改送文字並記住
# [llm.image_input]
# "ollama" = false
# "opencode:some-text-model" = false

# 價格(USD / 百萬 token)與預算;不設就不限制
# [llm.pricing."deepseek:deepseek-chat"]
# input_per_mtok = 0.27
# cached_input_per_mtok = 0.07
# output_per_mtok = 1.10
# [llm.budget]
# daily_usd = 2.0
# monthly_usd = 40.0
# degrade_at = 0.8           # 用到 80% 時改用便宜模型 / 少主動發話
# on_exhausted = "stop"

# ---- 長期記憶 --------------------------------------------------------------
# DeepSeek 沒有 embeddings;不設也能用(全文檢索 + 新舊 + 重要度)。
# 有 Ollama / LM Studio / OpenAI 等 /embeddings 端點時可以打開:
# [memory.embedding]
# provider = "openai-compatible"
# base_url = "http://127.0.0.1:11434/v1"
# model = "bge-m3"

# ---- MCP 工具 --------------------------------------------------------------
# [mcp.servers.files]
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "C:/data"]
# tools_allow = ["read_*"]

# ---- 語音辨識 / 合成 -------------------------------------------------------
# 本機 worker 見 workers/README.md;也可以換成雲端(kind = "openai")
[speech.asr.local]
kind = "http-worker"
url = "${ASR_URL:-http://127.0.0.1:8001}"

# workers/tts 預設用 faster-qwen3-tts(原生 Windows、真串流)
# 另一個選項:WSL2 / Docker 上的 vLLM-Omni(見 workers/README.md 第 3 節)
# [speech.tts.qwen]
# kind = "vllm-omni"
# base_url = "http://127.0.0.1:8091/v1"
# voice = "deepseek-chan"
# language = "Chinese"

[speech.tts.local]
kind = "http-worker"
url = "${TTS_URL:-http://127.0.0.1:8002}"
voice = "deepseek-chan"

# ---- 子系統 --------------------------------------------------------------
# 每個 [modules.<id>] 都可以加 enabled = false 關掉

# 擁有者只在這裡設定(舊設定檔的 [modules.auth] owners 仍然有效,兩邊會合併)
[modules.commands]
owners = ["discord:${MIYORIA_OWNER_ID:-0}"]

# 角色與權限節點(owner > admin > moderator > trusted > user > restricted > blocked)
[modules.auth]
# default_role = "user"

[modules."platform.discord.bot"]
token = "${DISCORD_BOT_TOKEN:-}"
# 填伺服器 id 可以讓 slash command 立即生效;空的 = 全域(最多要等一小時)
# id 要加引號,例如 ["123456789012345678"](數字太大,TOML 整數會失真)
# 每次啟動會清掉另一種範圍留下的舊指令;指令清單有重複時可執行一次
# `miyoria discord commands reset`
command_guilds = []
# 讓她知道誰在線、在玩什麼、誰在哪個語音頻道。要先在 Developer Portal → Bot →
# Privileged Gateway Intents 打開 Presence Intent 與 Server Members Intent;
# 沒開就設成 false,否則 Discord 會拒絕連線
presence_intents = true

# Admin API:CLI(`miyoria module ...`)和之後的管理面板用。token 由 `miyoria init` 產生
[modules.api]
bind = "127.0.0.1:7878"
token = "${MIYORIA_API_TOKEN:-}"
# Prometheus 指標在 GET /metrics,預設跟 /api 一樣要 Authorization: Bearer <token>
# (Prometheus 用 authorization.credentials 帶 token)。設成 true 就不用驗證,
# 但連得到 bind 位址(或前面的反向代理)的人都看得到。
# metrics_public = false

# 管理面板用 Discord 登入(token 照樣能用)。三個值都填才會開啟;
# redirect_uri 要跟 Developer Portal → OAuth2 → Redirects 裡的一模一樣,
# 也要跟你在瀏覽器開面板的網址同源(見 docs/OPERATIONS.md)。
# 擁有者與 admin 角色可以登入;其他角色要 `/admin perm allow` 給 admin.panel.access(唯讀)
# 與 admin.panel.write(可修改)。
# [modules.api.discord_oauth]
# client_id = "${DISCORD_CLIENT_ID:-}"
# client_secret = "${DISCORD_CLIENT_SECRET:-}"
# redirect_uri = "http://127.0.0.1:7878/api/auth/oauth/callback"
# session_days = 7
# cookie_secure = true             # 預設:redirect_uri 是 https 就開

# Self 帳號語音節點(apps/voice-node)連進來的位址;token 由 `miyoria init` 產生
[modules."voice.link"]
bind = "127.0.0.1:7879"
token = "${VOICE_LINK_TOKEN:-}"

# Stage 節點(VTube Studio / OBS / overlay)連進來的位址
[modules."stage.link"]
bind = "127.0.0.1:7882"
token = "${STAGE_LINK_TOKEN:-}"

# OBS 智慧場景:每個場景的用途(chat 聊天 / game 遊戲 / brb 暫離 / starting 開場 / ending 結尾 / sing 唱歌)。
# 第一次看到 OBS 的場景清單時用 fast 模型從名稱判斷(沒有模型就用關鍵字),面板「直播」頁可以改;
# 這裡寫的最優先,面板不能改。導演:開台 → 開場再到聊天、開始玩遊戲 → 遊戲、直播中沒人講話或她離開語音
# → 暫離、下播 → 結尾(先停留 ending_ms 再真的停播)、唱歌 → 唱歌(放原曲 MV,唱完回到原本的場景)。
# 她也可以自己用 stage_scene 換。
[modules."stage.link".scenes]
# director = true
# roles = { chat = "聊天", game = "遊戲", brb = "暫離", starting = "開場", ending = "結尾", sing = "唱歌" }
# transition = { name = "Fade", duration_ms = 300 }   # 每次切換用的轉場(OBS 裡的名稱)
# transitions = { game = { name = "Stinger" } }       # 個別用途的轉場(stinger 不用給長度)
# starting_ms = 30000        # 開場畫面停多久
# ending_ms = 6000           # 停播前結尾畫面停多久
# brb_after_ms = 300000      # 直播中多久沒人講話就切暫離(0 = 不切)
# manual_hold_ms = 120000    # 有人手動切場景後,導演多久不插手
# min_switch_ms = 8000       # 兩次自動切換至少隔多久

# 擴充套件資料夾(`miyoria ext list` / `miyoria ext dev`)。子資料夾 examples/ 不會載入;
# 想試範例(/hello)就把 "extensions/examples" 加進來
[modules.extensions]
dirs = ["extensions"]
# task_grace_ms = 5000      # 擴充的任務超過預算這麼久還沒回報結束,主機就判它逾時
# 擴充只拿到白名單內的環境變數(PATH、TEMP、HOME…加上 manifest [env] pass 列的),拿不到這裡的密鑰。
# 要多給一個擴充變數:
# [extensions."miyoria.minecraft"]
# env = { MIYORIA_MC_TOKEN = "${MC_TOKEN:-}" }   # 直接設定值
# env_pass = ["MIYORIA_MC_*"]                    # 取代 manifest 的 [env] pass
# minecraft_dir = 'C:\Users\<你>\AppData\Roaming\PrismLauncher\instances\<實例>\.minecraft'
# 她要玩時自己用 Prism Launcher 開遊戲(實例 id 從 minecraft_dir 推,Prism 執行檔自動找)
# prism_path = 'C:\Users\<你>\AppData\Local\Programs\PrismLauncher\prismlauncher.exe'
# launch_world = "latest"      # 直接進最近玩的存檔;"" = 停在主選單
# quit_on_stop = "launched"    # 停止玩時只關她自己開的遊戲(always / never)

# 遊戲(導演迴路)。`game start` 會先確認遊戲開著、模組連上了;沒開就請 adapter 自己開
# (auto_launch),開不起來才拒絕並說原因。動作失敗後一陣子不給 goto / mine,逼她換方法
# [modules.game]
# default_game = "minecraft"
# require_connected = true
# auto_launch = true
# launch_wait_secs = 240
# failure_guard_secs = 45
# task_budget_secs = 240     # 一個目標(任務)的預算;遊戲沒建議時用這個,不超過 max_goal_secs
# directed_games = ["minecraft"]   # 導演只玩有目標的遊戲(Threads 已關閉,不再由導演驅動)

# 唱歌(點歌):歌曲 worker(workers/sing,見 workers/README.md 第 9 節)用她的聲音翻唱。
# 有人點歌她自己決定要不要唱、什麼時候唱;/queue song request 是強制(好了、她有空就唱)。
# 唱的時候插話不會打斷,/queue song skip | stop 才會。Go Live 要讓觀眾聽到歌,voice node 要 GOLIVE_AUDIO=true
# [modules.sing]
# url = "http://127.0.0.1:8005"
# start = "decide"           # decide:準備好了她挑時機唱;auto:好了就唱
# max_pending_per_user = 2   # 每個人同時最多幾首在歌單上
# lyrics = true              # 同步歌詞變成 overlay 字幕
# lip_sync_vocals = true     # 嘴型跟轉換後的人聲走(不是整首混音)
# vote_skip_ratio = 0.25     # /queue song voteskip:語音裡這個比例的人投了就跳過(無條件進位)
# vote_skip_min = 1          # 至少幾票;點歌的人自己投一票就跳過
# video = true               # 唱的時候在直播畫面放原曲影片(靜音);Stage 用 [stage.obs] song_video_source 播
# video_dir = "data/songs"   # worker 的 SING_DATA_DIR(直播機上的路徑),不在裡面的影片不會送
# prepare_notice = true      # worker 做歌要整張顯示卡時(SING_OFFLOAD_URLS),她先說「我去準備一下歌喔」再讓它開始
# prepare_notice_gap_secs = 180   # 連點好幾首時這段時間內不再說第二次

# 遊戲內聊天變成獨立的對話(每個世界 / 伺服器一段歷史)。玩家在 Discord 用 /me link 拿代碼,
# 在遊戲聊天室打 `!link <代碼>` 就跟 Discord 帳號連在一起;沒連的玩家是陌生人。
# 她在遊戲裡的回話很短、不會下指令;直播中又在語音裡時也用語音說(她可以用 game_chat_reply 自己改)
[modules."game.chat"]
# games = ["minecraft"]
# world = "local"            # 這個世界 / 伺服器的名字(對話情境的 scope;頻道模式可用 "minecraft:local")
# username = ""              # 她在遊戲裡的名字(別人提到時才知道是在叫她)
# max_chars = 120            # 她在遊戲聊天室一句最多幾個字
# reply = "auto"             # auto | chat | voice | both

[modules.voice]
consent = "opt-out"        # opt-out:預設收音,可用 /voice consent off 退出;opt-in:同意後才收
barge_in = "selective"     # 有人插話時:selective(只有這回合要回的人 / 叫她名字 / 對她說實質內容才停,其他人只降音量)| stop(任何人都停)| ignore
# barge_in_ms = 600            # 這回合要回的人講多久先暫停她(stop 模式:任何人講多久就停)
# barge_in_duck_ms = 250       # 其他人講多久她就降音量
# barge_in_duck_gain = 0.3     # 降音量時剩多少(0~1)
# barge_in_focus_stop_ms = 3000 # 要回的人一直講到這麼久,不等語音辨識就停
# names = ["她的名字", "暱稱"]    # 叫到這些字就停(profile 的名字模組會自己補上)
# music_gate = true            # 唱歌時只有叫她名字的句子算有人講話
# self_echo_tail_ms = 5000     # 她講完後這段時間內,轉錄跟她說的話重複就當回音
# vad_engine = "energy"        # energy | silero(silero 要另外註冊引擎,沒有就退回 energy)
# vad_silero_model = ""        # silero_vad.onnx 的路徑
# tts_prefetch = 2             # 她說話時先合成後面幾句(0 = 關閉)
# tts_prefetch_ttl_ms = 30000  # 預先合成的句子沒人用,過這麼久就丟掉
# speech_hold_max_ms = 90000   # 唱歌 / 顯示卡借出時她的話最多等這麼久,再久就丟掉
# 說話用另一種語言(例如日文聲線比較好聽):每句先用 LLM(fast)翻譯再送 TTS,字幕和聊天紀錄維持原文
# tts_translate = "Japanese"
# Discord Go Live:voice node 的 ffmpeg 在這裡等 OBS 推流(對應 OBS 的伺服器 + 金鑰)。
# 預設 = OBS 伺服器 rtmp://127.0.0.1:1935/live、金鑰 miyoria。`/voice golive start` 會用它
# (她還不在語音裡時,會先進你所在的語音頻道)。
# golive_source = "rtmp://127.0.0.1:1935/live/miyoria"

# 她的行動閘門:進語音、開台、換場景、玩遊戲、私訊……不論誰要求都要過這裡(紀錄在稽核紀錄)。
# 緊急暫停用 /admin autonomy pause;每個人可以用 /me privacy 拒絕私訊或被主動找
[modules.actions]
# forbidden = ["message.dm"]     # 完全禁止的能力(也可以 "stream.*")
# dm_strangers = false           # 不私訊不熟的人(熟悉度低於 stranger_familiarity)
# [modules.actions.medium]       # 中風險動作的次數上限(她自己決定或聊天請求時;指令不受限)
# per_day = 30
# per_person_per_day = 8
# cooldown_ms = 20000
# inline_wait_ms = 8000          # 高風險工具(跑程式等)等審核多久;來不及就晚點在後續回合告訴她結果
# [modules.actions.limits."code.run"]
# per_day = 50
# cooldown_ms = 5000

# 她在做什麼(ActivityManager):語音、直播、活動(遊戲 / 唱歌)只有這一個主人。她的工具、指令、
# 面板、導演都經過它:重複的要求不會重做、同一件事一次只做一個;工具立刻回「開始了,task …」,
# 做好或失敗(含原因,例如「開台失敗:OBS 沒開」)再通知她。開台 = Go Live + OBS 兩步;離開語音前先關台,
# 等她把話講完才離開。
[modules.activity]
# golive_timeout_ms = 60000      # Go Live 多久沒開始就算失敗
# obs = true                     # 連著直播機時 OBS 是開台的第二步(過閘門);false = 只有 Go Live
# obs_start_delay_ms = 3000      # Go Live 開了之後等多久才按 OBS 開始直播
# obs_attempts = 3
# voice_timeout_ms = 20000       # 進 / 離開語音等確認的時間
# speech_wait_ms = 30000         # 離開語音前最多等她把那一輪話講完多久
# game_timeout_ms = 300000       # 遊戲最多開多久(含啟動器與載入世界)
# failed_hold_ms = 120000        # 失敗的活動(例如遊戲斷線)留著給大家看多久
# notice_ttl_ms = 600000         # 通知多久後就不用再告訴她

[modules.agent]
# 文字頻道的聊天等級:off(關閉)| mention-only(只回提及)| quiet(安靜)| normal(一般)| lively(活躍)
# (always = 每則都回,測試用;舊的 ambient = normal)。等級是上限:她在等級之內自己決定要多話,
# 有人請她安靜點她也會自己調。沒設定的頻道用 profile 的 default_channel_mode(預設 quiet)。
# 也可以在 Discord 用 /channel mode 或面板「內心 → 世界」即時切換
# default_mode = "quiet"
# channels = { "<channel id>" = "lively", "discord:<guild id>" = "mention-only" }
# 對話紀錄:最多幾個字進 prompt(舊的先丟)、單則上限;她寫 @名字 會變成真的 tag
# max_prompt_chars = 16000
# max_entry_chars = 2000
# mention_users = true
# 回合:最後一則訊息後等多久才開始回(打字中會延長);回覆會引用叫她的那則訊息;
# 對話整理過後至少留幾則原文
# debounce_ms = 800
# reply_reference = true
# history_after_fold = 25
# 合併後的 talkativeness 下限(她自己明確設成 0 除外;別人在回她剛說的話時一律不擋)
# attention = { talk_floor = 0.15 }

# 語音聊天。也可以用 /voice mode 即時切換。要不要插話 = 她的多話程度(心智迴圈或「活躍點」)
# × 佔比上限;有人還在講話時她不插嘴。舊的 ambient_factor、cooldown_ms、min_cooldown_ms、
# interrupt_scale 已經拿掉(留著也能讀,只會警告);她自己多久開一次口由 [modules.arbiter] 決定
[modules.agent.voice]
default_mode = "normal"    # off | mention-only | normal | always(語音沒有安靜 / 活躍之分)
debounce_ms = 700          # 對方講完後等多久(看他是不是還要繼續講)
text_chat = true           # 她在語音頻道裡時,那個頻道文字區打的字她也用說的回
text_aside = true          # 用說的回時,網址和程式碼改貼到語音頻道的文字區
direct_debounce_ms = 400   # 有人叫她(名字、她剛講完就問她)時只等這麼久
# voice_first = true       # 雙語語音:先寫 <voice> 那句,寫完馬上送 TTS,中文字幕後補(false = 等中文寫完一起送)

# 她沒親眼看到的上下文:重開後(或很久沒人講話後)補抓頻道之前的訊息、回覆鏈。
# 需要 Bot 的「讀取訊息歷史」權限;抓不到就用自己的訊息紀錄
[modules.agent.history]
backfill = 20              # 冷啟動補抓幾則(0 = 不補抓)
reply_chain = 3            # 回覆的訊息不在紀錄裡時,最多往上抓幾則
timeout_ms = 3000          # 最多等多久,逾時就不等了直接回

# 看圖(聊天模型要收圖片,見 [llm.image_input]):她回的訊息、它回覆的訊息、
# 同一個人兩分鐘內傳的圖
[modules.agent.vision]
enabled = true
max_images = 3             # 每回合最多幾張
max_image_bytes = 5000000  # 單張上限
# detail = "auto"          # auto | low | high(low 最便宜)

# prompt 編譯器:每一段參考資料有自己的字數上限(超過就留整行、標「還有幾行略過」),
# 其他模組附上的段落加起來不超過 max_context_chars(超過時公平分配,不是後面的直接被砍)
[modules.agent.prompt]
default_budget = 600       # 沒列在 budgets 的段落
self_chars = 1600          # 她自己的狀態(心情、在做什麼、方針、議程、限制)
save_every = 1             # 每幾個回合存一份壓縮過的實際 prompt(面板看;0 = 不存)
# budgets = { conversation = 900, memory = 1000, knowledge = 700, lessons = 500, world = 500, game = 700, sing = 400, people = 800, examples = 2500 }

# 她的感知:誰在線、在玩什麼、誰在哪個語音頻道、各頻道熱不熱鬧。
# 每個人都能用 /me privacy presence:off 不讓她讀自己的狀態
[modules.world]
# guilds = []                    # 只看這些伺服器;空的 = bot 所在的每個伺服器(各伺服器的資料只在該伺服器用)
care_min_affinity = 30           # 好感或熟悉度到這個程度,對方上線 / 進語音時她才會注意到
care_min_familiarity = 40
# game_interests = ["Minecraft"] # 除了角色的 interests 之外,她有興趣的遊戲
cooldown_secs = 900              # 同一件事(同一個人上線…)多久內不再提醒她
max_salient_per_minute = 6
# voice_activity_window_secs = 300 # 語音裡的對話(語音辨識的句子)算在多長的時間內
# voice_lively_lines = 6         # 這段時間內這麼多句,或 voice_quiet_secs 內有人說話 = 正在聊天(不是冷場)
# voice_quiet_secs = 40

# 她的內在:慾望(想聊天、想玩、想被注意、想休息、好奇)、無聊、她自己定的方針與議程、
# 對每個人的感情描述。數字只決定自然漂移的速度,怎麼做由她自己判斷
[modules.self]
boredom_per_hour = 0.15          # 沒事做時無聊上升的速度
# [modules.self.rise_per_hour]   # 各慾望自己上升的速度
# social = 0.08
# play = 0.05
# attention = 0.04
# curiosity = 0.05
# esteem = 0.04                  # 想被認可、想表現
# hunger = 0.05                  # 想吃白飯(Token)
# longing = 0.12                 # 暗戀的人不在時,想念他的速度(沒有暗戀對象就慢慢退)
# [modules.self.emotions]        # 她的情緒(七情);各情緒來得多快、退得多快是 profile 的 [temperament]
# notice = 0.2                   # 超過這個才算明顯:放進 prompt、決定她表現出來的樣子
# prompt_max = 3                 # prompt 最多列幾種情緒
# missing_after_hours = 20       # 在乎的人多久沒出現開始想念
# jealousy_lines = 3             # 在乎的人在 jealousy_window_mins 內回覆別人幾次、都沒理她就吃醋
# jealousy_window_mins = 15
# budget_per_10min = 0.9         # 所有情緒加起來,任何 10 分鐘內最多被激起這麼多(避免一次爆滿;0 = 不限)
# [modules.self.bond]            # 對人的關係只會小步、每天有上限地改(由每日回顧提議;在意程度只有回顧能動)
# attachment_step = 0.03         # 在意程度一次最多動這麼多
# attachment_daily = 0.06        # ...每人每天最多
# affinity_step = 2              # 好感 / 信任 / 熟悉度同理
# affinity_daily = 4
# [modules.self.mood]            # 心情不單獨存,是從慾望、情緒和時段算出來的
# night_dip = 0.4                # 深夜精力最多掉這麼多
# emotion_weight = 1             # 情緒對心情的影響(0 = 只看基準值、時段與慾望)
# [modules.self.heart]           # 心動與暗戀:只從她喜歡的人的互動自己長出來,沒有人能設定
# min_affinity = 25              # 好感至少這麼多才會心動
# daily_gain = 0.06              # 每人每天最多長這麼多
# crush_threshold = 0.35         # 心動最高、而且超過這個的人就是她暗戀的人(可能沒有)
# crush_margin = 0.08            # 別人要多這麼多才會換人

# 她的心智迴圈:有事發生(有人上線 / 進語音、頻道冷掉、語音冷場、她剛講完話)或心跳時,
# 她自己想一想:寫內心獨白、調整感受與方針、決定要不要主動做事(每件事都要過行動閘門)。
# 想法時間軸在面板「內心 → 想法」;/admin autonomy pause 會讓她停止思考。
# 這裡只有成本與頻率的上限,怎麼想、做什麼是她自己決定
[modules.mind]
max_calls_per_hour = 12          # 一小時最多想幾次(心跳會依狀況自己放慢 / 加快)
min_interval_secs = 45           # 兩次之間至少隔多久
# max_heartbeat_mins = 30        # 心跳最慢多久一次
# max_intents = 2                # 一次想法最多做幾件事
# self_start_gap_voice_secs = 300 # 同一個語音頻道,她自己主動開口至少隔多久
# self_start_gap_text_secs = 600 # 同一個文字頻道 / 私訊
# self_start_max_backoff = 8     # 主動開口沒人接,間隔每次加倍,最多到這麼多倍;有人跟她說話就恢復
# stale_topic_mins = 45          # 她提過、沒人接的話題,這段時間內不再提
# blocked_retry_mins = 30        # 失敗的動作(例如遊戲沒開時的 game.start)狀況沒變前不再試,最久這麼久
# journal_keep = 200             # 想法日誌保留幾則原文;再多 digest_batch 則就把最舊的整理成摘要
# digest_batch = 50
# digests_keep = 60              # 摘要保留幾則(在面板「內心 → 想法」)
# 慢想拆成三個小呼叫(推理等級在 [llm.reasoning]:appraise / plan / plan_daily / reflect):
# 一段互動結束後 Appraise 感受、目標觸發 / 活動結束 / 在意的人上線 / 心情變差 / 心跳時 Plan 計畫
# (改目標、交 0–2 個衝動給 Arbiter)、每天第一次 Plan 寫今天的計畫;Reflect 在 [modules.reflect]
# heartbeat_mins = 15            # 閒著時 Plan 的心跳
# min_heartbeat_mins = 4         # 很無聊、需求很缺時最快到這麼快
# 什麼都沒做的 Plan 會讓下一次心跳變慢(最慢 max_heartbeat_mins);狀況沒變的心跳不問模型
# appraise_quiet_secs = 120      # 一段互動安靜這麼久就算結束,回想它的感受
# appraise_min_lines = 4         # 至少這麼多句才回想
# appraise_max_per_hour = 6
# goal_default_days = 3          # 沒寫期限的目標(舊議程、追問)多久後過期
# goal_max_days = 14             # 目標最長留多久
# goal_refire_mins = 30          # 目標的觸發條件一直成立時,隔多久再叫她一次
# cared_attachment = 0.3         # 在意程度到這裡的人上線會叫醒她
# mood_drop = 0.25               # 心情(愉快度)比上次計畫時掉這麼多就重新計畫
# daily_hour = 6                 # 這個時間之後的第一次 Plan 是今天的計畫
# quiet_start_hour / quiet_end_hour / voice_quiet_secs 已移除(留著會警告):安靜時段只有
# [modules.arbiter] 一份,語音冷場只有 [modules.world] 的 voice_quiet_secs 一個偵測器

# ---- 反思與學習(自主層階段 G)-------------------------------------------------

# 對話筆記:每個頻道 / 私訊 / 語音 / 遊戲聊天,每 fold_every_messages 句或停頓 fold_idle_secs
# 秒,她就把還沒整理的對話併進自己的筆記(用途 summarizer,在背景跑,不影響語音延遲)。
# prompt 放筆記 + 最近的原文,舊的對話被丟掉也不會忘記。
# [modules.conversation]
# fold_every_messages = 16
# fold_idle_secs = 90
# max_calls_per_hour = 40        # 所有頻道合計;預算 degraded 時減半、間隔加倍,exhausted 停止
# max_calls_per_day = 400
# min_interval_secs = 30         # 同一個頻道兩次整理至少隔多久
# stale_thread_mins = 30         # 筆記裡這麼久沒人碰的事(懸而未決的問題、話題)不再放進 prompt
# drop_thread_mins = 240         # 這麼久沒人碰的事直接從筆記刪掉(只是改寫措辭不算碰;0 = 不刪)

# 她自己整理的資料庫(人、伺服器、她自己、她取名的主題):內容結構由她決定,這裡只有大小上限
# [modules.knowledge]
# max_docs = 400
# max_docs_per_subject = 12
# max_doc_chars = 6000
# said_confidence = 0.6          # 別人說的關於別人的事,信心最多這麼高
# tool = true                    # 聊天時可以用工具 knowledge_note 整理

# 反思:每天 daily_hour 之後找安靜的時候回顧一天(整理記憶、取代過時的、更新資料與感情、
# 從大家的反應檢討自己、寫下學到的事、定長期目標),長對話結束後也會稍微反思一下
# [modules.reflect]
# daily_hour = 5
# max_calls_per_day = 6
# min_interval_mins = 30
# light_after_lines = 80
# reply_window_mins = 10         # 她說完話之後多久內的回覆算回應她
# light_after_total_lines = 300  # 自上次反思後各處累積這麼多句,安靜時就稍微反思一下(0 = 關)
# max_bonds = 5                  # 一次反思最多整理幾個人的人物卡(在意程度每人每天最多調一次)

# 長期記憶的新鮮度:回想時只放真的相關的事,舊的、現在式的、一直重複的會被淘汰。
# [modules.memory]
# min_score = 0.25               # 低於這個分數不回想(原本 0.05,幾乎什麼都放)
# min_vector = 0.3               # 沒有共同的字時,向量至少這麼像才算相關(在場的人的記憶也一樣要相關)
# episode_recency_tau_days = 1.5 # 事件記憶(episode)的新近度衰減:小時到幾天,不是幾週
# state_note_hours = 12          # 「已經開台」「正在下載」這類現在式的筆記多久後失效(0 = 不失效)
# followup_max_age_hours = 6     # 追問過了時間這麼久沒人提就自動關掉;先挑最新的(0 = 不自動關)
# [modules.memory.repeat]        # 同一個梗在最近回想的 window 則裡出現超過 allowed 次就降權
# window = 40
# allowed = 3
# penalty = 0.15                 # 每多一次扣這麼多比例的分數
# floor = 0.4                    # 最低乘到這麼多

# 仲裁(Arbiter):她想說話 / 做事的唯一關卡。她自己開的話題(心智迴圈 / 計畫)、唱歌報幕、
# 遊戲實況、追問、打招呼都先到這裡;規則只有這一份(取代舊的 [modules.initiative]、心智迴圈的
# 第二套安靜時段和 chat.start 的次數限制),而且會寫進她的帳本,讓她看得到:「你今天主動開了
# 5 次話題,最近 3 次沒人接;下次可主動在 21:40 之後」。報幕、實況、追問不算她主動開的話題。
[modules.arbiter]
quiet_start_hour = 1             # 安靜時段(當地時間,含開始、不含結束;相同 = 沒有):她不自己開口,
quiet_end_hour = 7               # 回別人、點的歌、事情的結果不受影響
# utc_offset_minutes = 480       # 她的時區(UTC+8)
# day_start_hour = 4             # 「今天」從幾點開始算
max_per_day = 12                 # 她自己開話題:一天最多幾次(0 = 不限)
# max_per_context_per_day = 4    # 同一個頻道 / 語音 / 私訊一天最多幾次
# max_per_person_per_day = 4     # 同一個人一天最多被她主動找幾次
# min_gap_secs = 60              # 任兩次之間至少隔多久
# gap_text_secs = 600            # 同一個地方兩次之間至少隔多久;沒人接一次就加倍,最多 max_backoff 倍
# gap_voice_secs = 300
# max_backoff = 8
# reply_window_text_secs = 600   # 她說完後這段時間內有人叫她 / 回她,才算有人接
# reply_window_voice_secs = 300
# stale_topic_mins = 45          # 沒人接的話題列給她看多久(這段時間內不再提)
# after_speech_text_secs = 5     # 打招呼和她自己開話題,至少等她講完這麼久
# after_speech_voice_secs = 20
# disabled_contexts = []         # 這些頻道她不主動說話(discord:<guild>:<channel> 或頻道 id)
# greeting = true                # 朋友當天第一次說話時打招呼
# voice_join = true              # 好感夠的人進她的語音頻道時打招呼
# followup = true                # 之前說好要問的事,對方在的時候提出來

# ---- 程式沙箱 ----------------------------------------------------------------

# 她寫的程式在用完即丟、不能連外的 Docker 容器裡執行(需要 Docker Desktop / Docker Engine)。
# 預設關閉,要明確寫 enabled = true 才會啟動;Docker 沒開時模組顯示 degraded,不影響其他功能。
# Docker 可用時她會多出工具 code_run(跑程式)、tool_propose(把寫好的程式提出成工具)與已核准的
# sbx_<name>;前兩個是高風險,她自己審核,有疑慮才私訊你確認。/admin autonomy status 看狀態,
# GET /api/sandbox/tools 看她寫的工具。安全說明見 packages/sandbox/README.md。
# [modules.sandbox]
# enabled = true
# root = "data/sandbox"          # runs/<id>(每次執行)與 profiles/<profile>/tools(她留下的腳本)
# default_timeout_ms = 30000
# max_timeout_ms = 120000
# max_concurrent = 2
# keep_runs = 20                 # 保留最近幾次執行的輸出檔
# result_chars = 900             # 程式輸出回給她的字數上限(低於 agent 的 max_tool_result_chars)
# tool_timeout_ms = 8000         # 她寫的工具每次呼叫的時間上限(低於 agent 的 tool_timeout_ms)
# images = { python = "python:3.12-slim", node = "node:24-slim" }  # 可釘 digest:...@sha256:<hash>
# limits = { memory_mb = 256, cpus = 1, pids_limit = 128 }
# pool_size = 0                  # 預設 0 = 關;設 1 以上:每種語言先開好幾個等著的容器(每個只跑一次就丟),一般執行不用等容器啟動
# sessions = { max = 3, idle_minutes = 15, lifetime_minutes = 120, disk_mb = 256 }  # 她的工作階段(同名的執行共用 /work)
# 跑程式的次數上限在 [modules.actions.limits."code.run"](預設每天 30 次、冷卻 20 秒)

# ---- Stage 節點(在直播機執行 `miyoria stage`)-------------------------------
[stage]
core_url = "ws://127.0.0.1:7882/stage-link"
token = "${STAGE_LINK_TOKEN:-}"
# overlay_backdrop = "data/stage/backdrop.jpg"   # 直播背景圖(overlay 的 ?layer=backdrop 會模糊、壓暗它)

[stage.vts]
enabled = true                 # VTube Studio:設定 → 開啟 API(port 8001)
# face_found = true            # 注入時告訴 VTS 有臉(不播模型的「追蹤遺失」動畫);自己開臉部追蹤時改 false

# [stage.lipsync]
# latency_ms = 180             # 嘴型延後多久(觀眾比播放器晚聽到聲音);嘴比聲音早就加大,晚就調小
# 眨眼、動作、情緒漸變、手勢:[stage.blink] / [stage.motion] / [stage.emotion] / [stage.gesture],見 docs/protocols/stage-link.md

[stage.obs]
enabled = false                # OBS:工具 → WebSocket 伺服器設定
host = "127.0.0.1"
port = 4455
password = "${OBS_PASSWORD:-}"
# subtitle_source = "Miyoria 字幕"   # 她最新的一句話;OBS 沒有這個文字來源時自動建在目前場景下方
# 唱歌時放原曲影片的媒體來源(要自己在「唱歌」場景建,見 docs/protocols/stage-link.md「唱歌時放影片」)
# song_video_source = "Miyoria 歌曲影片"
# song_video_dir = "data/songs"      # worker 的 SING_DATA_DIR;不在裡面的路徑不放
# song_video_lead_ms = 0             # 影片比歌慢就加大(OBS 開檔要一點時間)
# song_video_resync_ms = 300         # 跟歌差超過就 seek

# 回放紀錄(v2 §4):把她聽到、看到的事件(訊息、語音轉錄、在線狀態、遊戲 / 唱歌事件)逐行寫進
# <dir>/<日期>.jsonl,之後用 `pnpm replay <檔案>` 拿假模型重播,看回合、Arbiter 與活動狀態的決策。
# 紀錄裡有大家說的話,所以預設關閉,只存在這台電腦上。
[modules.replay]
record = false
# dir = "data/replay"
