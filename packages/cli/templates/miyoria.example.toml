# Miyoria 設定檔(由 `miyoria init` 建立;之後用 `miyoria config` 修改)。
# 字串可以用 ${ENV_VAR} 或 ${ENV_VAR:-預設值} 引用環境變數 / .env。

[core]
profile = "deepseek-chan"          # profiles/<id>/
profiles_dir = "profiles"
database_url = "${DATABASE_URL:-sqlite:data/miyoria.db}"
log = "info,miyoria=debug"

# ---- LLM ----------------------------------------------------------------
# 任何 OpenAI 相容 API 都可以:填 base_url、api_key,模型 id 在 purposes 裡。
[llm.providers.deepseek]
kind = "deepseek"                  # deepseek | openai | openai-compatible
base_url = "${LLM_BASE_URL:-https://api.deepseek.com}"
api_key = "${LLM_API_KEY:-}"

# 全域預設;profile.toml 的 [llm.purposes] 會覆寫
[llm.purposes]
chat = ["deepseek:deepseek-chat"]
# 高風險動作的自我審核;不設就用 chat 的模型(啟動後第一次審核會記一行警告)
review = ["deepseek:deepseek-chat"]

# 推理模型要不要先思考,依用途(沒列的 = 不思考)。不急的判斷開、要即時的關:
# 文字回覆會思考、語音回覆一律不思考(agent 每次自己決定,不看這裡的 chat)
[llm.thinking]
chat = true          # 文字聊天回覆
review = true        # 高風險動作的自我審核
summarizer = true    # 記憶整理
fast = false         # 要不要插話的快速判斷(語音裡一律不思考)

# 看圖:聊天模型支援圖片時,她直接用它看圖(deepseek-v4.1-flash 可以)。
# 不收圖片的模型或 provider 標 false(沒列的 = 收);被 API 拒絕時也會自動改送文字並記住
# [llm.image_input]
# "ollama" = false
# "opencode:some-text-model" = false

# 價格(USD / 百萬 token)與預算;不設就不限制
# [llm.pricing."deepseek:deepseek-chat"]
# input_per_mtok = 0.27
# cached_input_per_mtok = 0.07
# output_per_mtok = 1.10
# [llm.budget]
# daily_usd = 2.0
# monthly_usd = 40.0
# degrade_at = 0.8           # 用到 80% 時改用便宜模型 / 少主動發話
# on_exhausted = "stop"

# ---- 長期記憶 --------------------------------------------------------------
# DeepSeek 沒有 embeddings;不設也能用(全文檢索 + 新舊 + 重要度)。
# 有 Ollama / LM Studio / OpenAI 等 /embeddings 端點時可以打開:
# [memory.embedding]
# provider = "openai-compatible"
# base_url = "http://127.0.0.1:11434/v1"
# model = "bge-m3"

# ---- MCP 工具 --------------------------------------------------------------
# [mcp.servers.files]
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "C:/data"]
# tools_allow = ["read_*"]

# ---- 語音辨識 / 合成 -------------------------------------------------------
# 本機 worker 見 workers/README.md;也可以換成雲端(kind = "openai")
[speech.asr.local]
kind = "http-worker"
url = "${ASR_URL:-http://127.0.0.1:8001}"

# workers/tts 預設用 faster-qwen3-tts(原生 Windows、真串流)
# 另一個選項:WSL2 / Docker 上的 vLLM-Omni(見 workers/README.md 第 3 節)
# [speech.tts.qwen]
# kind = "vllm-omni"
# base_url = "http://127.0.0.1:8091/v1"
# voice = "deepseek-chan"
# language = "Chinese"

[speech.tts.local]
kind = "http-worker"
url = "${TTS_URL:-http://127.0.0.1:8002}"
voice = "deepseek-chan"

# ---- 子系統 --------------------------------------------------------------
# 每個 [modules.<id>] 都可以加 enabled = false 關掉

# 擁有者只在這裡設定(舊設定檔的 [modules.auth] owners 仍然有效,兩邊會合併)
[modules.commands]
owners = ["discord:${MIYORIA_OWNER_ID:-0}"]

# 角色與權限節點(owner > admin > moderator > trusted > user > restricted > blocked)
[modules.auth]
# default_role = "user"

[modules."platform.discord.bot"]
token = "${DISCORD_BOT_TOKEN:-}"
# 填伺服器 id 可以讓 slash command 立即生效;空的 = 全域(最多要等一小時)
# id 要加引號,例如 ["123456789012345678"](數字太大,TOML 整數會失真)
# 每次啟動會清掉另一種範圍留下的舊指令;指令清單有重複時可執行一次
# `miyoria discord commands reset`
command_guilds = []
# 讓她知道誰在線、在玩什麼、誰在哪個語音頻道。要先在 Developer Portal → Bot →
# Privileged Gateway Intents 打開 Presence Intent 與 Server Members Intent;
# 沒開就設成 false,否則 Discord 會拒絕連線
presence_intents = true

# Admin API:CLI(`miyoria module ...`)和之後的管理面板用。token 由 `miyoria init` 產生
[modules.api]
bind = "127.0.0.1:7878"
token = "${MIYORIA_API_TOKEN:-}"
# Prometheus 指標在 GET /metrics,預設跟 /api 一樣要 Authorization: Bearer <token>
# (Prometheus 用 authorization.credentials 帶 token)。設成 true 就不用驗證,
# 但連得到 bind 位址(或前面的反向代理)的人都看得到。
# metrics_public = false

# 管理面板用 Discord 登入(token 照樣能用)。三個值都填才會開啟;
# redirect_uri 要跟 Developer Portal → OAuth2 → Redirects 裡的一模一樣,
# 也要跟你在瀏覽器開面板的網址同源(見 docs/OPERATIONS.md)。
# 擁有者與 admin 角色可以登入;其他角色要 `/admin perm allow` 給 admin.panel.access(唯讀)
# 與 admin.panel.write(可修改)。
# [modules.api.discord_oauth]
# client_id = "${DISCORD_CLIENT_ID:-}"
# client_secret = "${DISCORD_CLIENT_SECRET:-}"
# redirect_uri = "http://127.0.0.1:7878/api/auth/oauth/callback"
# session_days = 7
# cookie_secure = true             # 預設:redirect_uri 是 https 就開

# Self 帳號語音節點(apps/voice-node)連進來的位址;token 由 `miyoria init` 產生
[modules."voice.link"]
bind = "127.0.0.1:7879"
token = "${VOICE_LINK_TOKEN:-}"

# Stage 節點(VTube Studio / OBS / overlay)連進來的位址
[modules."stage.link"]
bind = "127.0.0.1:7882"
token = "${STAGE_LINK_TOKEN:-}"

# 擴充套件資料夾(`miyoria ext list` / `miyoria ext dev`)。子資料夾 examples/ 不會載入;
# 想試範例(/hello)就把 "extensions/examples" 加進來
[modules.extensions]
dirs = ["extensions"]
# 擴充只拿到白名單內的環境變數(PATH、TEMP、HOME…加上 manifest [env] pass 列的),拿不到這裡的密鑰。
# 要多給一個擴充變數:
# [extensions."miyoria.minecraft"]
# env = { MIYORIA_MC_TOKEN = "${MC_TOKEN:-}" }   # 直接設定值
# env_pass = ["MIYORIA_MC_*"]                    # 取代 manifest 的 [env] pass

[modules.voice]
consent = "opt-out"        # opt-out:預設收音,可用 /voice consent off 退出;opt-in:同意後才收
barge_in = "stop"          # 有人插話時停止說話:stop | ignore
# 說話用另一種語言(例如日文聲線比較好聽):每句先用 LLM(fast)翻譯再送 TTS,字幕和聊天紀錄維持原文
# tts_translate = "Japanese"

# 她的行動閘門:進語音、開台、換場景、玩遊戲、私訊……不論誰要求都要過這裡(紀錄在稽核紀錄)。
# 緊急暫停用 /admin autonomy pause;每個人可以用 /me privacy 拒絕私訊或被主動找
[modules.actions]
# forbidden = ["message.dm"]     # 完全禁止的能力(也可以 "stream.*")
# dm_strangers = false           # 不私訊不熟的人(熟悉度低於 stranger_familiarity)
# [modules.actions.medium]       # 中風險動作的次數上限(她自己決定或聊天請求時;指令不受限)
# per_day = 30
# per_person_per_day = 8
# cooldown_ms = 20000
# inline_wait_ms = 8000          # 高風險工具(跑程式等)等審核多久;來不及就晚點在後續回合告訴她結果
# [modules.actions.limits."code.run"]
# per_day = 50
# cooldown_ms = 5000

[modules.agent]
# 頻道模式:off | mention-only | ambient | always。也可以在 Discord 用 /channel mode 即時切換
# default_mode = "ambient"
# channels = { "<channel id>" = "always", "discord:<guild id>" = "mention-only" }
# 對話紀錄:最多幾個字進 prompt(舊的先丟)、單則上限;她寫 @名字 會變成真的 tag
# max_prompt_chars = 16000
# max_entry_chars = 2000
# mention_users = true

# 語音聊天:比文字更保守,偶爾才插話。也可以用 /voice mode 即時切換
[modules.agent.voice]
default_mode = "ambient"
ambient_factor = 0.5       # 主動插話機率的倍率
cooldown_ms = 20000        # 她講完後至少隔多久才會再主動開口
debounce_ms = 700          # 對方講完後等多久(看他是不是還要繼續講)
text_chat = true           # 她在語音頻道裡時,那個頻道文字區打的字她也用說的回
text_aside = true          # 用說的回時,網址和程式碼改貼到語音頻道的文字區

# 她沒親眼看到的上下文:重開後(或很久沒人講話後)補抓頻道之前的訊息、回覆鏈。
# 需要 Bot 的「讀取訊息歷史」權限;抓不到就用自己的訊息紀錄
[modules.agent.history]
backfill = 20              # 冷啟動補抓幾則(0 = 不補抓)
reply_chain = 3            # 回覆的訊息不在紀錄裡時,最多往上抓幾則
timeout_ms = 3000          # 最多等多久,逾時就不等了直接回

# 看圖(聊天模型要收圖片,見 [llm.image_input]):她回的訊息、它回覆的訊息、
# 同一個人兩分鐘內傳的圖
[modules.agent.vision]
enabled = true
max_images = 3             # 每回合最多幾張
max_image_bytes = 5000000  # 單張上限
# detail = "auto"          # auto | low | high(low 最便宜)

# 她的感知:誰在線、在玩什麼、誰在哪個語音頻道、各頻道熱不熱鬧。
# 每個人都能用 /me privacy presence:off 不讓她讀自己的狀態
[modules.world]
# guilds = []                    # 只看這些伺服器;空的 = bot 所在的每個伺服器(各伺服器的資料只在該伺服器用)
care_min_affinity = 30           # 好感或熟悉度到這個程度,對方上線 / 進語音時她才會注意到
care_min_familiarity = 40
# game_interests = ["Minecraft"] # 除了角色的 interests 之外,她有興趣的遊戲
cooldown_secs = 900              # 同一件事(同一個人上線…)多久內不再提醒她
max_salient_per_minute = 6

# 她的內在:慾望(想聊天、想玩、想被注意、想休息、好奇)、無聊、她自己定的方針與議程、
# 對每個人的感情描述。數字只決定自然漂移的速度,怎麼做由她自己判斷
[modules.self]
boredom_per_hour = 0.15          # 沒事做時無聊上升的速度
# [modules.self.rise_per_hour]   # 各慾望自己上升的速度
# social = 0.08
# play = 0.05
# attention = 0.04
# curiosity = 0.05

# ---- 程式沙箱 ----------------------------------------------------------------
# 她寫的程式在用完即丟、不能連外的 Docker 容器裡執行(需要 Docker Desktop / Docker Engine)。
# 預設關閉,要明確寫 enabled = true 才會啟動;Docker 沒開時模組顯示 degraded,不影響其他功能。
# Docker 可用時她會多出工具 code_run(跑程式)、tool_propose(把寫好的程式提出成工具)與已核准的
# sbx_<name>;前兩個是高風險,她自己審核,有疑慮才私訊你確認。/admin autonomy status 看狀態,
# GET /api/sandbox/tools 看她寫的工具。安全說明見 packages/sandbox/README.md。
# [modules.sandbox]
# enabled = true
# root = "data/sandbox"          # runs/<id>(每次執行)與 profiles/<profile>/tools(她留下的腳本)
# default_timeout_ms = 30000
# max_timeout_ms = 120000
# max_concurrent = 2
# keep_runs = 20                 # 保留最近幾次執行的輸出檔
# result_chars = 900             # 程式輸出回給她的字數上限(低於 agent 的 max_tool_result_chars)
# tool_timeout_ms = 8000         # 她寫的工具每次呼叫的時間上限(低於 agent 的 tool_timeout_ms)
# images = { python = "python:3.12-slim", node = "node:24-slim" }  # 可釘 digest:...@sha256:<hash>
# limits = { memory_mb = 256, cpus = 1, pids_limit = 128 }
# 跑程式的次數上限在 [modules.actions.limits."code.run"](預設每天 30 次、冷卻 20 秒)

# ---- Stage 節點(在直播機執行 `miyoria stage`)-------------------------------
[stage]
core_url = "ws://127.0.0.1:7882/stage-link"
token = "${STAGE_LINK_TOKEN:-}"

[stage.vts]
enabled = true                 # VTube Studio:設定 → 開啟 API(port 8001)
# face_found = true            # 注入時告訴 VTS 有臉(不播模型的「追蹤遺失」動畫);自己開臉部追蹤時改 false

# [stage.lipsync]
# latency_ms = 180             # 嘴型延後多久(觀眾比播放器晚聽到聲音);嘴比聲音早就加大,晚就調小
# 眨眼、動作、情緒漸變、手勢:[stage.blink] / [stage.motion] / [stage.emotion] / [stage.gesture],見 docs/protocols/stage-link.md

[stage.obs]
enabled = false                # OBS:工具 → WebSocket 伺服器設定
host = "127.0.0.1"
port = 4455
password = "${OBS_PASSWORD:-}"
# subtitle_source = "Miyoria 字幕"   # 她最新的一句話;OBS 沒有這個文字來源時自動建在目前場景下方

