# One pnpm workspace for every TypeScript package. `spikes/` stays out (throwaway experiments
# with their own lockfiles); `legacy/rust` is the behavioural reference, not a package.
packages:
  - "packages/*"
  - "apps/*"
  - "extensions/*"
  - "extensions/*/adapter"
  - "extensions/examples/*"
  - "!spikes/**"
  - "!legacy/**"
