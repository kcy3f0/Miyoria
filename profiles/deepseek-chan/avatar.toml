# DeepSeek-chan 模型對照
#
# 模型:「DeepSeek-chan Live2D Model + Layered PSD」by Kamiya_Ryoko
# https://vgen.co/KAMIYA/product/deepseek-chan-deepseek-free-live2d-model-layered-psd-psd/1c55a71a-2747-4616-819d-2dc0a934089d
# 授權:個人直播、影片(含平台收益)可用;不可原樣再散佈或轉售模型檔 / PSD;公開分享要標註來源
#   → 模型檔放在 VTube Studio 的模型資料夾(StreamingAssets/Live2DModels/DeepSeek-chan),不放進這個 repo
#
# 下面的 expression 檔名對應官方模型的 Exp3/ 資料夾,hotkey 名稱對應模型裡的 hotkey(VTS 裡的模型名稱是「大肥鱼」)
#
# 每個情緒:
#   expression     重點貼圖(.exp3.json 或 hotkey 名稱),強度 >= accent_min 才開
#   params         VTS 輸入參數的姿勢;FaceAngle* / EyeRight* / EyeLeft* / MiyoriaBody* 是「加在動作上的偏移」,
#                  其他是絕對值(從 neutral 的值漸變過去,強度越低越接近 neutral)
#   blink          眨眼頻率倍數
#   gesture        可能觸發的手勢(下面 [gesture.*]),每次隨機挑一個;gesture_chance 是強度 1 時的機率
#
# 這個模型的輸入範圍(VTS 端的對應,見 大肥鱼.vtube.json):
#   EyeOpenLeft/Right 0..0.8 → 眼睛 0..1.5(0.53 ≈ 正常張開)
#   Brows 0.3..0.6 → 眉毛高度 -1..1(0.45 = 正中),同一個輸入 0..1 也推眉毛角度
#   MouthSmile 0..1 → 嘴型 ParamMouthForm -1..1(0.5 = 平);**VTS 預設也把 MouthSmile 接到 EyeSmile,
#                     要在 VTS 把「微笑」那條改成吃 MiyoriaEyeSmile(見 docs/protocols/stage-link.md)**
#   BrowInnerUp 0..0.5、MouthFunnel 0..0.4、MouthPucker -0.7..0.7、R/LEyeSquint、mouthSmileL/R 0..1
#   這些(和 JawOpen、MiyoriaEyeSmile、MiyoriaBodyX/Y/Z)是 Stage 連上時自己建立的自訂參數

vts_model = "大肥鱼"

# ---- 情緒 ----

[emotion.neutral]          # 休息姿勢:其他情緒的 params 都從這裡漸變過去
expression = ""
[emotion.neutral.params]
EyeOpenLeft = 0.55
EyeOpenRight = 0.55
Brows = 0.45
MouthSmile = 0.58
MiyoriaEyeSmile = 0.0
BrowInnerUp = 0.0
mouthSmileL = 0.1
mouthSmileR = 0.1
REyeSquint = 0.0
LEyeSquint = 0.0
CheekPuff = 0.0
MouthX = 0.0

[emotion.happy]
expression = "爱心眼.exp3.json"
accent_min = 0.7
blink = 1.0
gesture = ["chest", "teeth"]
gesture_chance = 0.3
[emotion.happy.params]
EyeOpenLeft = 0.5
EyeOpenRight = 0.5
Brows = 0.53
MouthSmile = 0.92
MiyoriaEyeSmile = 0.75
mouthSmileL = 0.55
mouthSmileR = 0.55
FaceAngleZ = 3
FaceAngleY = 2

