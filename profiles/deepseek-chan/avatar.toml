# ---- 手勢(模型自帶的動畫 / 貼圖)----
# open / close:hotkey 名稱或 .exp3.json(表情檔:顯示後再關掉,不用寫 close)
# group:同一組同時只會有一個(手只有兩隻);hold_ms 停留時間範圍;cooldown_ms 同一個手勢再次觸發的最短間隔

[gesture.finger]           # 竖手指:「我跟你說喔」
open = "竖手指打开"
close = "竖手指关闭"
group = "hands"
hold_ms = [2500, 5000]
cooldown_ms = 30000

[gesture.chest]            # 抚胸
open = "抚胸手打开"
close = "抚胸手关闭"
group = "hands"
hold_ms = [2000, 4500]
cooldown_ms = 30000

[gesture.grass]            # 狗尾巴草(發呆時)
open = "狗尾巴草打开"
close = "狗尾巴草关闭"
group = "hands"
hold_ms = [8000, 20000]
cooldown_ms = 90000

[gesture.sweat]            # 流冷汗
open = "流冷汗.exp3.json"
group = "face"
hold_ms = [2500, 4500]
cooldown_ms = 25000

[gesture.teeth]            # 兔牙
open = "兔牙.exp3.json"
group = "mouth"
hold_ms = [1500, 3000]
cooldown_ms = 40000

[gesture.loading]          # 加载中
open = "加载.exp3.json"
group = "face"
hold_ms = [2000, 4000]
cooldown_ms = 45000

[gesture.basin]            # 钢盆砸頭(很少)
open = "钢盆.exp3.json"
group = "head"
hold_ms = [1500, 2500]
cooldown_ms = 120000

[gesture.lean]             # 前倾
open = "前倾.exp3.json"
group = "body"
hold_ms = [2000, 4000]
cooldown_ms = 40000

[idle]                     # 安靜一陣子之後偶爾拿狗尾巴草
gesture = ["grass"]
every_ms = [60000, 150000]
after_ms = 15000

# ---- 嘴型 ----

[lipsync]
mode = "inject"        # inject:由 TTS 音訊算出嘴型注入;mic:VTS 用虛擬音源線自己做
# VTS 的追蹤參數(0..1);這個模型把它們對應到 ParamMouthOpenY / ParamMouthForm
mouth_open = "MouthOpen"
mouth_form = "MouthSmile"
jaw = "JawOpen"        # 自訂參數,模型的「Jaw Open」吃它
vowels = true          # 依音色估計 A/I/U/E/O,注入 VoiceA..VoiceO / VoiceSilence(模型對應到 ParamA..ParamO)

# 每個母音的嘴型偏移(乘上張嘴程度與該母音的權重)
[lipsync.shape.i]
MouthSmile = 0.12
MouthPucker = 0.25
[lipsync.shape.e]
MouthSmile = 0.08
MouthPucker = 0.15
[lipsync.shape.u]
MouthPucker = -0.35
MouthFunnel = 0.12
[lipsync.shape.o]
MouthPucker = -0.2
MouthFunnel = 0.25

[credit]
text = "\"DeepSeek-chan Live2D Model + Layered PSD\" by Kamiya_Ryoko"
