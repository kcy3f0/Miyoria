# DeepSeek-chan 的 lorebook(像 SillyTavern 的 World Info):平常不在 prompt 裡,
# 聊天裡出現關鍵字、或她現在的心情對得上時,才在這回合最後的 <style_note> 裡提醒她一下。
# 只放在每回合會變的結尾,不影響前面固定、可快取的部分。改完重開就生效。
#
# ── [[kaomoji]] 顏文字字典,依心情分組 ─────────────────────────────────────────
#   group  = 組名(只是給人看的)
#   moods  = 哪些心情會用到這組:她的情緒標記(neutral happy smug annoyed angry embarrassed
#            sad surprised thinking)或 self 模組的情緒(joy anger sorrow fear surprise disgust shy
#            pride jealousy lonely missing gratitude guilt frustration)
#   faces  = 顏文字。不要放含反引號的(Discord 會當成程式碼)
#   每個文字回合從這裡挑 4 個給她參考:大多是現在心情那組,再加一兩個別組的;她最近
#   十則左右用過的不會再挑。語音回合不給顏文字。
#
# ── [[entries]] 梗和提醒 ─────────────────────────────────────────────────────────
#   id       = 名字(唯一,給人看和記錄用)
#   keys     = 觸發的詞:最近幾則別人的訊息或她要回的訊息裡有出現就算(英文不分大小寫)
#   moods    = (可省略)她現在的心情是這些之一時也觸發,名稱同上
#   text     = 提醒的內容:寫她會怎麼反應的「提醒」,一兩行就好,不要寫成台詞劇本
#   priority = 同時觸發太多時,數字大的先(一回合最多 3 則)
#   channel  = "text"(只在文字)、"voice"(只在語音)或 "both"(預設)

